name: Publish runtime
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [nexus, forge, sentinel, vessel, lore]
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and assets
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/validate.py
          python3 - <<'PY'
          import json, os
          version = json.load(open('manifests/release.template.json'))['runtime_version']
          assert os.environ['TAG'] == 'v' + version, 'tag and manifest version differ'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            ROLE=${{ matrix.role }}
            RUNTIME_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/the-agenticflow/workspace-runtime-${{ matrix.role }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/the-agenticflow/workspace-runtime-${{ matrix.role }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/the-agenticflow/workspace-runtime-${{ matrix.role }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL
      - name: Record image digest
        env:
          ROLE: ${{ matrix.role }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ROLE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.role }}
          path: digests/${{ matrix.role }}.txt
          if-no-files-found: error
          retention-days: 7

  publish-manifest:
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Generate digest-pinned manifest
        run: python3 scripts/validate.py --digests-dir digests
      - name: Publish release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-manifest.json --verify-tag --title "$TAG" --notes "Workspace runtime candidate. Check release-manifest.json for compatibility before use."
