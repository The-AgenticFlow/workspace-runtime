name: Publish runtime
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/validate.py
          python3 - <<'PY'
          import json, os
          version = json.load(open('manifests/release.template.json'))['runtime_version']
          assert os.environ['TAG'] == 'v' + version, 'tag and manifest version differ'
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/the-agenticflow/workspace-runtime:${{ github.ref_name }}
          build-args: RUNTIME_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/the-agenticflow/workspace-runtime
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/the-agenticflow/workspace-runtime@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL
      - name: Generate digest-pinned manifest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 scripts/validate.py --digest "$IMAGE_DIGEST"
      - name: Publish release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-manifest.json --verify-tag --title "$TAG" --notes "Workspace runtime candidate. Check release-manifest.json for compatibility before use."
