name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then exit 0; fi
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            PR_TITLE=$(gh pr view "$REF_NAME" --json title --jq .title)
            export PR_TITLE
          fi
          python3 - <<'PY'
          import os, re, sys
          title = os.environ['PR_TITLE']
          pattern = r'(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9-]*\))?(!)?: .+'
          if not re.fullmatch(pattern, title):
              print(f'PR title must use Conventional Commits syntax: {title!r}', file=sys.stderr)
              sys.exit(1)
          print(f'Conventional PR title: {title}')
          PY

  role-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [nexus, forge, sentinel, vessel, lore]
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and role assets
        run: python3 scripts/validate.py
      - name: Check shell syntax
        run: sh -n scripts/openflows-runtime && find roles -name '*.sh' -exec sh -n {} +
      - name: Build image
        run: docker build --platform linux/amd64 --build-arg ROLE=${{ matrix.role }} -t workspace-runtime-${{ matrix.role }}:ci .
      - name: Check role and installed assets
        run: |
          docker run --rm workspace-runtime-${{ matrix.role }}:ci openflows-runtime check
          docker run --rm workspace-runtime-${{ matrix.role }}:ci sh -c '
            set -eu
            openflows-runtime install
            test -f "$HOME/.openflows/artifacts/orchestration/agent/agents/$OPENFLOWS_IMAGE_ROLE.agent.md"
            test "$(find /opt/openflows/orchestration/agent/agents -type f | wc -l)" -eq 1
            test "$(find /opt/openflows/orchestration/plugin/hooks -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
            test -f "/opt/openflows/orchestration/plugin/hooks/$OPENFLOWS_IMAGE_ROLE/session_start.sh"
            test ! -e /opt/openflows/orchestration/plugin/plugin.json
            test ! -e /opt/openflows/orchestration/plugin/hooks/hooks.json
            test ! -e /opt/openflows/orchestration/plugin/.codex-plugin
            for skill in /opt/openflows/orchestration/plugin/skills/*; do
              case "${skill##*/}" in
                "$OPENFLOWS_IMAGE_ROLE"-*|shared-*) ;;
                *) echo "Unexpected skill: $skill" >&2; exit 1 ;;
              esac
            done
          '
          other_role=forge
          if [ "${{ matrix.role }}" = forge ]; then other_role=lore; fi
          if docker run --rm -e OPENFLOWS_ROLE="$other_role" workspace-runtime-${{ matrix.role }}:ci openflows-runtime check; then
            echo 'Image accepted another role' >&2
            exit 1
          fi

  validate:
    needs: [conventional-title, role-image]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All five role images passed validation'
