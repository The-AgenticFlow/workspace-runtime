name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request title and commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            PR_NUMBER=$(gh pr view "$REF_NAME" --json number --jq .number)
            PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq .title)
          fi
          export PR_TITLE
          if [ "$EVENT_NAME" = push ]; then
            gh api "repos/$GH_REPO/commits/$GITHUB_SHA" \
              --jq '{sha: .sha, parents: (.parents | length), subject: (.commit.message | split("\n")[0])}' > commits.jsonl
          else
            gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/commits?per_page=100" \
              --jq '.[] | {sha: .sha, parents: (.parents | length), subject: (.commit.message | split("\n")[0])}' > commits.jsonl
          fi
          python3 - <<'PY'
          import json, os, re, sys
          pattern = r'(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9-]*\))?(!)?: .+'
          errors = []
          if os.environ['EVENT_NAME'] != 'push':
              title = os.environ['PR_TITLE']
              if not re.fullmatch(pattern, title):
                  errors.append(f'PR title: {title!r}')
          checked = 0
          for line in open('commits.jsonl'):
              commit = json.loads(line)
              if commit['parents'] > 1:
                  continue  # GitHub-generated branch-sync merge commits
              checked += 1
              if not re.fullmatch(pattern, commit['subject']):
                  errors.append(f"{commit['sha'][:12]}: {commit['subject']!r}")
          if checked == 0:
              errors.append('No non-merge commits found')
          if errors:
              print('Expected Conventional Commit subjects (type(scope)!: description):', file=sys.stderr)
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          scope = ' and PR title' if os.environ['EVENT_NAME'] != 'push' else ''
          print(f'Validated {checked} commit subject(s){scope}')
          PY

  role-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [nexus, forge, sentinel, vessel, lore]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate manifest and role assets
        run: python3 scripts/validate.py
      - name: Check shell syntax
        run: sh -n scripts/openflows-runtime && find roles -name '*.sh' -exec sh -n {} +
      - name: Build image
        run: docker build --platform linux/amd64 --build-arg ROLE=${{ matrix.role }} -t workspace-runtime-${{ matrix.role }}:ci .
      - name: Check role and installed assets
        run: |
          docker run --rm workspace-runtime-${{ matrix.role }}:ci openflows-runtime check
          docker run --rm workspace-runtime-${{ matrix.role }}:ci openflows-harness --help >/dev/null
          docker run --rm workspace-runtime-${{ matrix.role }}:ci sh -c '
            set -eu
            openflows-runtime install
            test "$(id -u)" -eq 1000
            test -x /usr/bin/python3
            test -x /usr/bin/git
            test -x /usr/bin/curl
            test -x /usr/bin/sudo
            if command -v claude || command -v codex || command -v aider || command -v goose || command -v node || command -v npm; then
              echo "Unexpected agent CLI or Node.js in runtime image" >&2
              exit 1
            fi
            test -f "$HOME/.openflows/artifacts/orchestration/agent/agents/$OPENFLOWS_IMAGE_ROLE.agent.md"
            test "$(find /opt/openflows/orchestration/agent/agents -type f | wc -l)" -eq 1
            test "$(find /opt/openflows/orchestration/plugin/hooks -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
            test -f "/opt/openflows/orchestration/plugin/hooks/$OPENFLOWS_IMAGE_ROLE/session_start.sh"
            test ! -e /opt/openflows/orchestration/plugin/plugin.json
            test ! -e /opt/openflows/orchestration/plugin/hooks/hooks.json
            test ! -e /opt/openflows/orchestration/plugin/.codex-plugin
            for skill in /opt/openflows/orchestration/plugin/skills/*; do
              case "${skill##*/}" in
                "$OPENFLOWS_IMAGE_ROLE"-*|shared-*) ;;
                *) echo "Unexpected skill: $skill" >&2; exit 1 ;;
              esac
            done
          '
          other_role=forge
          if [ "${{ matrix.role }}" = forge ]; then other_role=lore; fi
          if docker run --rm -e OPENFLOWS_ROLE="$other_role" workspace-runtime-${{ matrix.role }}:ci openflows-runtime check; then
            echo 'Image accepted another role' >&2
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned quality tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/workspace-runtime-quality"
          mkdir -p "$tool_dir"
          gh release download v0.11.0 -R koalaman/shellcheck -p shellcheck-v0.11.0.linux.x86_64.tar.gz -D "$tool_dir"
          gh release download v3.14.1 -R mvdan/sh -p shfmt_v3.14.1_linux_amd64 -D "$tool_dir"
          gh release download v1.7.12 -R rhysd/actionlint -p actionlint_1.7.12_linux_amd64.tar.gz -D "$tool_dir"
          cd "$tool_dir"
          printf '%s  %s\n' \
            b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 shellcheck-v0.11.0.linux.x86_64.tar.gz \
            76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf shfmt_v3.14.1_linux_amd64 \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 actionlint_1.7.12_linux_amd64.tar.gz \
            | sha256sum -c -
          tar -xzf shellcheck-v0.11.0.linux.x86_64.tar.gz
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          mv shfmt_v3.14.1_linux_amd64 shfmt
          chmod +x shfmt actionlint
          printf '%s\n%s\n' "$tool_dir" "$tool_dir/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Install Python quality tools
        run: |
          python3 -m venv "$RUNNER_TEMP/quality-venv"
          "$RUNNER_TEMP/quality-venv/bin/python" -m pip install \
            ruff==0.17.4 codespell==2.4.3 zizmor==1.16.3
          printf '%s\n' "$RUNNER_TEMP/quality-venv/bin" >> "$GITHUB_PATH"
      - name: Check Python style and formatting
        run: |
          ruff check scripts
          ruff format --check scripts
      - name: Check shell syntax, style, and safety
        run: |
          shellcheck --severity=warning scripts/openflows-runtime roles/*/hooks/*.sh
          shfmt -ln posix -i 2 -d scripts/openflows-runtime
          shfmt -ln bash -i 2 -d roles/*/hooks/*.sh
      - name: Check spelling
        run: codespell .github manifests Dockerfile README.md CONTRIBUTING.md RELEASING.md scripts roles shared
      - name: Check workflows
        run: |
          actionlint
          zizmor --min-severity high .github/workflows
      - name: Check Dockerfile
        run: |
          docker run --rm -i \
            -v "$PWD/.hadolint.yaml:/.hadolint.yaml:ro" \
            ghcr.io/hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --config /.hadolint.yaml - < Dockerfile

  arm64-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ARM64 Forge image
        run: docker buildx build --platform linux/arm64 --build-arg ROLE=forge --load -t workspace-runtime-forge:arm64-ci .
      - name: Check ARM64 runtime
        run: |
          docker run --rm --platform linux/arm64 workspace-runtime-forge:arm64-ci openflows-runtime check
          docker run --rm --platform linux/arm64 workspace-runtime-forge:arm64-ci openflows-harness --help >/dev/null

  validate:
    needs: [conventional-commits, quality, role-image, arm64-smoke]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All role images and quality checks passed validation'
