name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request title and commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            PR_NUMBER=$(gh pr view "$REF_NAME" --json number --jq .number)
            PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq .title)
          fi
          export PR_TITLE
          if [ "$EVENT_NAME" = push ]; then
            gh api "repos/$GH_REPO/commits/$GITHUB_SHA" \
              --jq '{sha: .sha, parents: (.parents | length), subject: (.commit.message | split("\n")[0])}' > commits.jsonl
          else
            gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/commits?per_page=100" \
              --jq '.[] | {sha: .sha, parents: (.parents | length), subject: (.commit.message | split("\n")[0])}' > commits.jsonl
          fi
          python3 - <<'PY'
          import json, os, re, sys
          pattern = r'(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9-]*\))?(!)?: .+'
          errors = []
          if os.environ['EVENT_NAME'] != 'push':
              title = os.environ['PR_TITLE']
              if not re.fullmatch(pattern, title):
                  errors.append(f'PR title: {title!r}')
          checked = 0
          for line in open('commits.jsonl'):
              commit = json.loads(line)
              if commit['parents'] > 1:
                  continue  # GitHub-generated branch-sync merge commits
              checked += 1
              if not re.fullmatch(pattern, commit['subject']):
                  errors.append(f"{commit['sha'][:12]}: {commit['subject']!r}")
          if checked == 0:
              errors.append('No non-merge commits found')
          if errors:
              print('Expected Conventional Commit subjects (type(scope)!: description):', file=sys.stderr)
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          scope = ' and PR title' if os.environ['EVENT_NAME'] != 'push' else ''
          print(f'Validated {checked} commit subject(s){scope}')
          PY

  role-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [nexus, forge, sentinel, vessel, lore]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate manifest and role assets
        run: python3 scripts/validate.py
      - name: Check shell syntax
        run: sh -n scripts/openflows-runtime && find roles -name '*.sh' -exec sh -n {} +
      - name: Build image
        run: docker build --platform linux/amd64 --build-arg ROLE=${{ matrix.role }} -t workspace-runtime-${{ matrix.role }}:ci .
      - name: Check role and installed assets
        run: |
          docker run --rm workspace-runtime-${{ matrix.role }}:ci openflows-runtime check
          docker run --rm workspace-runtime-${{ matrix.role }}:ci openflows-harness --help >/dev/null
          docker run --rm workspace-runtime-${{ matrix.role }}:ci sh -c '
            set -eu
            openflows-runtime install
            test "$(id -u)" -eq 1000
            test -x /usr/bin/python3
            test -x /usr/bin/git
            test -x /usr/bin/curl
            test -x /usr/bin/sudo
            if command -v claude || command -v codex || command -v aider || command -v goose || command -v node || command -v npm; then
              echo "Unexpected agent CLI or Node.js in runtime image" >&2
              exit 1
            fi
            test -f "$HOME/.openflows/artifacts/orchestration/agent/agents/$OPENFLOWS_IMAGE_ROLE.agent.md"
            test "$(find /opt/openflows/orchestration/agent/agents -type f | wc -l)" -eq 1
            test "$(find /opt/openflows/orchestration/plugin/hooks -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
            test -f "/opt/openflows/orchestration/plugin/hooks/$OPENFLOWS_IMAGE_ROLE/session_start.sh"
            test ! -e /opt/openflows/orchestration/plugin/plugin.json
            test ! -e /opt/openflows/orchestration/plugin/hooks/hooks.json
            test ! -e /opt/openflows/orchestration/plugin/.codex-plugin
            for skill in /opt/openflows/orchestration/plugin/skills/*; do
              case "${skill##*/}" in
                "$OPENFLOWS_IMAGE_ROLE"-*|shared-*) ;;
                *) echo "Unexpected skill: $skill" >&2; exit 1 ;;
              esac
            done
          '
          other_role=forge
          if [ "${{ matrix.role }}" = forge ]; then other_role=lore; fi
          if docker run --rm -e OPENFLOWS_ROLE="$other_role" workspace-runtime-${{ matrix.role }}:ci openflows-runtime check; then
            echo 'Image accepted another role' >&2
            exit 1
          fi

  arm64-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ARM64 Forge image
        run: docker buildx build --platform linux/arm64 --build-arg ROLE=forge --load -t workspace-runtime-forge:arm64-ci .
      - name: Check ARM64 runtime
        run: |
          docker run --rm --platform linux/arm64 workspace-runtime-forge:arm64-ci openflows-runtime check
          docker run --rm --platform linux/arm64 workspace-runtime-forge:arm64-ci openflows-harness --help >/dev/null

  validate:
    needs: [conventional-commits, role-image, arm64-smoke]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All five role images passed validation'
